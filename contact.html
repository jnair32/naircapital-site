<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Nair Capital</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"></span><span class="brand-text">Nair <span>Capital</span></span></a>
      <button class="menu-button" data-menu-button aria-label="Open menu" aria-expanded="false">☰</button>
      <nav class="site-nav" data-site-nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="themes.html">Investment Themes</a>
        <a class="active" href="contact.html">Contact</a>
        <a href="legal.html">Legal</a>
        <a class="research-link" href="research/index.html">Research</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="page-title">
      <div class="section-inner">
        <p class="eyebrow">Contact</p>
        <h1>Get in touch.</h1>
        <p>For research access or general enquiries, send a private message to Nair Capital.</p>
      </div>
    </section>
    <section class="section">
      <div class="section-inner">
        <article class="card contact-card">
          <h3>Contact Form</h3>
          <form class="contact-form" action="/api/contact" method="post" data-contact-form>
            <label for="name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" required>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>

            <label for="topic">Topic</label>
            <select id="topic" name="topic">
              <option>Research access</option>
              <option>General enquiry</option>
              <option>Partnership</option>
            </select>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="6" required></textarea>

            <label class="hidden-field" for="company">Company</label>
            <input class="hidden-field" id="company" name="company" type="text" tabindex="-1" autocomplete="off">

            <button class="button form-button" type="submit">Send Message</button>
            <p class="form-status" data-form-status role="status"></p>
          </form>
          <p class="form-note">Your message will be reviewed privately by Nair Capital.</p>
        </article>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="footer-inner">
      <span>© Nair Capital</span>
    </div>
  </footer>
  <script src="assets/js/main.js"></script>
</body>
</html>
